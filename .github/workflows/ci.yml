name: CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Database Data
        run: npm run db:generate
        env:
          TOTAL_RECORDS: 10000

      - name: Build Application
        run: npm run build

      - name: Run Automated Tests
        run: npm run test

      - name: Run Linter
        run: npm run lint
